# Impostazioni di commons-uploader.
#
# Al primo avvio lo script copia questo file in «config.ini»: modifica QUELLO,
# con il Blocco note o qualsiasi editor di testo. Le righe che iniziano con #
# sono spiegazioni e vengono ignorate.
#
# NON scrivere qui la password: ti viene chiesta a ogni avvio e non viene salvata.

[commons]
# Il nome utente della tua bot password, nella forma NomeUtente@nomebot.
# Si crea su https://commons.wikimedia.org/wiki/Special:BotPasswords
# Esempio: utente = Mario Rossi@caricamenti
utente =

[foto]
# La cartella che contiene le foto e il foglio «pattypan ... .xls».
# Esempio: cartella = C:\Users\mario\Pictures\gita a Pisa
cartella =

# La fotocamera da indicare nella pagina del file.
#   auto      la legge dai dati EXIF di ogni foto (consigliato)
#   nessuna   non la indica
#   un nome   lo stesso per tutte le foto, es. fotocamera = Sony ILCE-7M3
# Viene indicata solo se su Commons esiste il modello corrispondente
# («Template:Taken with ...»); altrimenti è omessa senza errori.
fotocamera = auto

# Il luogo dello scatto, in inglese, aggiunto alla data (facoltativo).
# Di solito il Paese (es. luogo = Italy) o una grande città (es. luogo = Paris).
luogo =

# Avviso sui diritti della personalità ({{personality rights}}), da usare
# quando nelle foto compaiono persone riconoscibili.
#   no   mai
#   sì   su tutte le foto
# Per deciderlo foto per foto, aggiungi al foglio una colonna
# «personality_rights» e scrivi «sì» nelle righe che lo richiedono.
personality_rights = no

[caricamento]
# Secondi di pausa tra un file e l'altro.
pausa = 2

# Che cosa fare se Commons segnala un problema (per esempio un file identico
# già presente).
#   no   il file non viene caricato e il problema viene elencato alla fine
#   sì   il file viene caricato comunque
ignora_avvisi = no
